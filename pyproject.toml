[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devrar"
version = "0.1.0"
description = "Your AI coding, rated and wrapped. Local-first developer recaps with receipts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "src/devrar/assets/fonts/*-OFL.txt"]
authors = [{name = "DevRAR contributors"}]
dependencies = ["tzdata>=2024.1; platform_system == 'Windows'"]
keywords = ["developer-tools", "wrapped", "claude", "codex", "local-first"]

[project.optional-dependencies]
compressed = ["zstandard>=0.22"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.10", "build>=1"]
browser = ["playwright>=1.45"]

[project.scripts]
devrar = "devrar.cli:kyria"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devrar = ["assets/*.html", "assets/*.css", "assets/*.js", "assets/fonts/*.woff2", "assets/fonts/*-OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["browser: isolated Chromium tests, enabled with DEVRAR_BROWSER_TESTS=1"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
