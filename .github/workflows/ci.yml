name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,compressed]"
      - run: python -m ruff check src tests
      - run: python -m mypy src/devrar --strict
      - run: python -m pytest -q -p no:cacheprovider --cov=devrar --cov-report=term-missing --cov-fail-under=100
      - run: python -m build
      - run: devrar wrap --demo --output ./devrar-demo

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_browser.py -p no:cacheprovider
        env:
          DEVRAR_BROWSER_TESTS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/
          if-no-files-found: ignore
